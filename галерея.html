.image-gallery {

.image-box {

    position: relative;
    z-index: 1;
}

.image-box img {
    width: 100%;
    height: auto;
    cursor: pointer;
    display: block;
    object-fit: normal;
}

.image-title {
    text-align: center;
    margin: 0;
    padding: 5px 10px;
    font-size: 14px;
    font-weight: 600;
    color: #454545;
    word-wrap: break-word;

}

.image-title a {
    color: #454545;
    text-decoration: none;
    display: block;
    width: 100%;
    height: 100%;
}

.image-title a:hover {
    font-size: 16px;
    color: #303030;
}

.image-title a:active {
    font-weight: 700;
    color: #ffffff;
}

.ybutton {
    background-color: transparent;
    border: none;
    padding: 0;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    cursor: pointer;
    transform: translateZ(0);
}

.ybutton img {
    width: 80px;
    height: auto;
    display: block;
    transition: transform 0.2s ease, filter 0.2s ease;
}

.ybutton:hover img {
    transform: scale(1.15);
    filter: brightness(1.2);
}

.ybutton:active img {
    transform: scale(0.95);
}

body:has(#page-loader) .image-box,
body:has(#page-loader) .image-box img,
body:has(#page-loader) .ybutton {
    z-index: -1 !important;
    position: static !important;
    transform: none !important;
    pointer-events: none !important;
}

@media (max-width: 992px) {
    .image-gallery {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }
}

@media (max-width: 768px) {
    .image-gallery {

    .image-box {

    }

@media (max-width: 480px) {

        gap: 25px;
        padding: 20px 25px;
    }
    .image-box {

}

<script>
    const windowsIcons = [];
    const getRandom = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function makeIconDraggable(img) {
        let isDragging = false;
        let isMoved = false;
        let startX, startY;
        let shiftX, shiftY;

        img.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;

            startX = e.clientX;
            startY = e.clientY;
            isMoved = false;
            isDragging = true;

            const rect = img.getBoundingClientRect();
            shiftX = e.clientX - rect.left;
            shiftY = e.clientY - rect.top;

            img.style.zIndex = '5';

            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;

            if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
                isMoved = true;
            }

            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY + window.scrollY;

            img.style.left = `${newX}px`;
            img.style.top = `${newY}px`;

            img.style.transform = `rotate(${img.dataset.angle}deg)`;
        });

        document.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;

            img.style.zIndex = '1';

            if (!isMoved) {

                if (typeof playRandomMusic === "function") {
                    playRandomMusic();
                }
            }
        });

        img.ondragstart = function() { return false; };
    }

    const generateRetroIcons = () => {
        const iconCount = getRandom(15, 30);
        const spawnedIcons = [];
        const minDistance = 50;
        const screenWidth = window.innerWidth;

        const screenHeight = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight,
            document.body.offsetHeight,
            document.documentElement.offsetHeight,
            document.body.clientHeight,
            document.documentElement.clientHeight
        );

        for (let i = 0; i < iconCount; i++) {
            const img = document.createElement('img');

            img.src = `мята.png`;
            img.classList.add('retro-icon');

            img.style.width = '80px';
            img.style.height = 'auto';

            img.style.position = 'absolute';
            img.style.pointerEvents = 'auto';
            img.style.cursor = 'move';
            img.style.userSelect = 'none';
            img.style.webkitUserSelect = 'none';

            img.style.zIndex = '-10000';

            let posX, posY;
            let attempts = 0;
            let tooClose = false;

            do {
                tooClose = false;
                posX = getRandom(10, screenWidth - 40);
                posY = getRandom(10, screenHeight - 40);
                attempts++;

                for (let icon of spawnedIcons) {
                    const dist = Math.hypot(posX - icon.x, posY - icon.y);
                    if (dist < minDistance) {
                        tooClose = true;
                        break;
                    }
                }
            } while (tooClose && attempts < 60);

            spawnedIcons.push({ x: posX, y: posY });

            const randomAngle = getRandom(-45, 45);
            img.dataset.angle = randomAngle;

            img.style.left = `${posX}px`;
            img.style.top = `${posY}px`;
            img.style.transform = `rotate(${randomAngle}deg)`;

            document.body.appendChild(img);

            makeIconDraggable(img);
        }

        const allDivs = document.querySelectorAll('div');
        allDivs.forEach(div => {
            const currentPosition = window.getComputedStyle(div).position;
            if (currentPosition === 'static') {
                div.style.position = 'relative';
            }
            div.style.zIndex = '1000';
        });
    };

    window.addEventListener('DOMContentLoaded', generateRetroIcons);
</script>
